[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cemd-curriculum-matcher"
version = "0.1.0"
description = "Curriculum-to-catalog matching application for CEMD QA workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.20.0",
  "pandas>=1.5.0",
  "rapidfuzz>=2.0.0",
  "rank-bm25>=0.2.2",
  "scikit-learn>=1.0.0",
  "sentence-transformers>=2.2.0",
  "torch>=1.9.0",
  "tqdm>=4.60.0",
  "transformers>=4.20.0",
]

[project.scripts]
curriculum-matcher = "curriculum_matcher.app:main"
curriculum-matcher-evaluate = "curriculum_matcher.evaluation_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
